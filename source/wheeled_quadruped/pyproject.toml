[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wheeled_quadruped"
version = "0.4.0"
description = "Isaac Lab 3.x / Isaac Sim 6.2 reinforcement-learning tasks for a wheeled quadruped that balances on its two rear wheels (balance and velocity tasks)."
requires-python = ">=3.12,<3.13"
license = { text = "BSD-3-Clause" }
# Install into the official Isaac Lab main uv workspace, which owns the complete
# backend/runtime dependency set. Do not resolve a released 2.x framework here.
# Workspace package versions are independent of the Isaac Lab 3.x release number.
# Floors below match the main revision audited in docs/MIGRATION_ISAACLAB_3.md.
dependencies = [
    "isaaclab>=44.0.0",
    "isaaclab-physx>=11.0.0",
    "isaaclab-rl>=5.3.1",
    "isaaclab-tasks>=30.1.1",
    "gymnasium>=1.2.0",
]

[project.entry-points."isaaclab.tasks"]
wheeled_quadruped = "wheeled_quadruped.tasks"

[tool.setuptools.packages.find]
include = ["wheeled_quadruped*"]

[tool.setuptools.package-data]
"wheeled_quadruped.assets" = ["*.usd"]
"wheeled_quadruped.tasks.balance.agents" = ["*.yaml"]
"wheeled_quadruped.tasks.velocity.agents" = ["*.yaml"]
